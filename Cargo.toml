[workspace]
resolver = "3"
members = [
    "crates/nacre-core",
    "crates/nacre-node",
    "crates/nacre-swift",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bofeizhu/nacre"
readme = "README.md"
keywords = ["agent-memory", "knowledge-graph", "graphiti", "llm", "sqlite"]
categories = ["artificial-intelligence", "database", "data-structures", "text-processing"]

