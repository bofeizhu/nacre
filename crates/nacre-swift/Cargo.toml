[package]
name = "nacre-swift"
version = "0.0.1"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Swift bindings for nacre (UniFFI) — host-fulfilled model I/O for a native Apple host"

[lib]
name = "nacre_swift"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "0.32"
async-trait = "0.1"
nacre-core = { path = "../nacre-core" }
grit-core = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1.0"
uuid = "1"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
